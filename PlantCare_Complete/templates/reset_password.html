<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | PlantCare</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0b3d20, #247447, #a8d5a2);
            padding: 20px;
        }

        .reset-card {
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        .plant-icon {
            font-size: 48px;
        }

        h1 {
            color: #185c35;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            line-height: 1.5;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 18px;
            color: #234b32;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #c8d8ca;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 24px;
            border: none;
            border-radius: 8px;
            background: #237344;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #185c35;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #237344;
            text-decoration: none;
        }

        .notice {
            font-size: 13px;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div class="reset-card">
        <div class="plant-icon">🌱</div>

        <h1>Reset Password</h1>

        <p>Welcome back to PlantCare! Create a new password to keep caring for your plants.</p>

        <form>
            <label for="new-password">New Password</label>
            <input
                type="password"
                id="new-password"
                name="new_password"
                minlength="8"
                placeholder="Enter your new password"
                required
            >

            <label for="confirm-password">Confirm Password</label>
            <input
                type="password"
                id="confirm-password"
                name="confirm_password"
                minlength="8"
                placeholder="Confirm your new password"
                required
            >

            <button type="submit">Reset Password</button>
        </form>

        <p class="notice">Password must contain at least 8 characters.</p>

        <a href="{{ url_for('login') }}">← Back to Login</a>
    </div>
</body>
</html>

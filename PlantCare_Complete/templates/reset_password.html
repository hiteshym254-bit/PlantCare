
{% extends "base.html" %}
{% block content %}

<div style="max-width: 420px; margin: 50px auto; padding: 25px; background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.12);">

    <h2 style="text-align: center; color: #226b3a;">Forgot Password?</h2>

    <p style="text-align: center; color: #555;">
        Enter your registered email address to reset your password.
    </p>

    <form method="POST" action="{{ url_for('forgot_password') }}">
        <label for="email">Email Address</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your registered email"
            required
            style="width: 100%; box-sizing: border-box; padding: 12px; margin: 10px 0 18px; border: 1px solid #ccc; border-radius: 8px;"
        >

        <button
            type="submit"
            style="width: 100%; padding: 12px; background: #226b3a; color: white; border: none; border-radius: 8px; cursor: pointer;"
        >
            Reset Password
        </button>
    </form>

    <p style="text-align: center; margin-top: 18px;">
        <a href="{{ url_for('login') }}">Back to Login</a>
    </p>

</div>

{% endblock %}

{% extends "base.html" %}
{% block content %}

<div style="max-width: 500px; margin: 50px auto; padding: 30px; background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">

    <h2 style="text-align: center; color: #176b36;">
        Choose a New Password
    </h2>

    <p style="text-align: center; color: #555;">
        Your reset link is valid for one hour.
    </p>

    <form method="POST">

        <label for="password">New Password</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="At least 8 characters"
            minlength="8"
            required
            style="width: 100%; padding: 12px; margin: 10px 0 20px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px;"
        >

        <label for="confirm_password">Confirm New Password</label>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Enter the same password again"
            minlength="8"
            required
            style="width: 100%; padding: 12px; margin: 10px 0 20px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px;"
        >

        <button
            type="submit"
            style="width: 100%; padding: 14px; background: #08752e; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer;"
        >
            Save New Password
        </button>

    </form>

</div>

{% endblock %}
